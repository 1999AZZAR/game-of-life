<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined" rel="stylesheet">
    <title>Celular Automaton</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/1999AZZAR/1999AZZAR/readme/resources/logo.png">
</head>
<body class="relative bg-gray-900 text-gray-100 h-screen w-screen overflow-hidden">
    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm hidden z-20"></div>
    <!-- Floating settings toggle -->
    <button id="show-settings" class="fixed top-4 left-4 p-3 bg-white/90 backdrop-blur-sm text-gray-900 rounded-full shadow-lg hover:bg-white/100 hover:scale-110 transition z-40">
        <span class="material-icons-outlined">settings</span>
    </button>
    <div id="main" class="absolute inset-0 bg-gray-900">
        <canvas id="gameCanvas" class="absolute inset-0 w-full h-full"></canvas>
    </div>
    <div id="settings" class="fixed left-0 top-0 h-full w-80 bg-white/95 dark:bg-gray-800/95 backdrop-blur-md rounded-r-2xl shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out z-50 overflow-y-auto p-6">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-bold mb-4 flex items-center">
                <span class="material-icons-outlined align-middle mr-2 text-4xl">grid_on</span> Game of Life
            </h1>
            <button id="hide-settings" class="p-2 text-gray-200 hover:text-white">
                <span class="material-icons-outlined">close</span>
            </button>
        </div>
        <h3 class="text-xl font-semibold my-2">Console :</h3>
        <button id="start" class="w-full py-2 px-4 bg-purple-600 text-white rounded-lg hover:bg-purple-500 transition inline-flex items-center justify-center gap-2">
            <span class="material-icons-outlined">play_arrow</span> Start
        </button>
        <button id="stop" class="w-full py-2 px-4 bg-red-600 text-white rounded-lg hover:bg-red-500 transition inline-flex items-center justify-center gap-2">
            <span class="material-icons-outlined">stop</span> Stop
        </button>
        <button id="clear" class="w-full py-2 px-4 bg-yellow-500 text-white rounded-lg hover:bg-yellow-400 transition inline-flex items-center justify-center gap-2">
            <span class="material-icons-outlined">clear_all</span> Clear
        </button>
        <button id="random" class="w-full py-2 px-4 bg-green-600 text-white rounded-lg hover:bg-green-500 transition inline-flex items-center justify-center gap-2">
            <span class="material-icons-outlined">shuffle</span> Random
        </button>
        <h3 class="text-xl font-semibold my-2">Render Speed :</h3>
        <select id="speed-select" class="block w-full p-2 bg-gray-700 rounded mb-2">
            <option value="fast">Fast</option>
            <option value="normal" selected>Normal</option>
            <option value="slow">Slow</option>
            <option value="really-slow">Really Slow</option>
        </select>
        <h3 class="text-xl font-semibold my-2">Rule set :</h3>
        <select id="rule-select" class="block w-full p-2 bg-gray-700 rounded mb-2">
            <option id="rule1" value="1">Original Life (B3/S23)</option>
            <option id="rule2" value="2">Brian's Brain</option>
            <option id="rule3" value="3">Belousov-Zhabotinsky</option>
            <option id="rule4" value="4">HighLife (B36/S23)</option>
            <option id="rule5" value="5">Day and Night (B3678/S34678)</option>
            <option id="rule6" value="6">Seeds (B2/S)</option>
            <option id="rule7" value="7">7 states</option>
            <option id="rule8" value="8">Mazectric (B3/S12345)</option>
            <option id="rule9" value="9">5-Neighbor Life (Von Neumann)</option>
            <option id="rule10" value="10">Amoeba (B357/S1358)</option>
            <option id="rule11" value="11">SnowLife (B367/S235678)</option>
            <option id="rule12" value="12">FishFood (B2/S12)</option>
            <option id="rule13" value="13">Life Without Death (B3/S012345678)</option>
            <option id="rule14" value="14">Coral (B3/S45678))</option>
            <option id="rule15" value="15">Replicator (B1357/S1357)</option>
            <option id="rule16" value="16">Convolution Ruleset</option>
            <option id="rule0" value="0">Custom</option>
        </select>

        <div id="rule0-settings" style="display: none;" class="p-4 bg-gray-700 rounded">
            <h2 class="text-2xl font-bold text-center mb-4">Custom Rule(s)</h2>
            <h3 class="text-xl font-semibold my-2">Number of States</h3>
            <select id="state-select" class="block w-full p-2 bg-gray-700 rounded mb-2">
                <option value="2">2 States</option>
                <option value="3">3 States</option>
            </select>
            <h3 class="text-xl font-semibold my-2">Birth (B)</h3>
            <input type="checkbox" name="b" value="0"> 0
            <input type="checkbox" name="b" value="1"> 1
            <input type="checkbox" name="b" value="2"> 2
            <input type="checkbox" name="b" value="3"> 3
            <input type="checkbox" name="b" value="4"> 4
            <input type="checkbox" name="b" value="5"> 5
            <input type="checkbox" name="b" value="6"> 6
            <input type="checkbox" name="b" value="7"> 7
            <input type="checkbox" name="b" value="8"> 8
            <div id="dying-states" style="display: none;">
                <h3 class="text-xl font-semibold my-2">Dying (D)</h3>
                <input type="checkbox" name="d" value="0"> 0
                <input type="checkbox" name="d" value="1"> 1
                <input type="checkbox" name="d" value="2"> 2
                <input type="checkbox" name="d" value="3"> 3
                <input type="checkbox" name="d" value="4"> 4
                <input type="checkbox" name="d" value="5"> 5
                <input type="checkbox" name="d" value="6"> 6
                <input type="checkbox" name="d" value="7"> 7
                <input type="checkbox" name="d" value="8"> 8
            </div>
            <h3 class="text-xl font-semibold my-2">Survival (S)</h3>
            <input type="checkbox" name="s" value="0"> 0
            <input type="checkbox" name="s" value="1"> 1
            <input type="checkbox" name="s" value="2"> 2
            <input type="checkbox" name="s" value="3"> 3
            <input type="checkbox" name="s" value="4"> 4
            <input type="checkbox" name="s" value="5"> 5
            <input type="checkbox" name="s" value="6"> 6
            <input type="checkbox" name="s" value="7"> 7
            <input type="checkbox" name="s" value="8"> 8
        </div>

        <div id="rule3-settings" style="display: none;">
            <label for="max-states" class="text-xl font-semibold my-2">Max States (n):</label>
            <input type="number" id="max-states" class="block w-full p-2 bg-gray-700 rounded mb-2" min="2" max="1000" value="50">
        </div>

        <div id="convolution-settings" style="display: none;">
            <h2 class="text-2xl font-bold text-center mb-4">Convolution Settings</h2>
            <div class="setting">
                <label for="convolution-kernel" class="text-xl font-semibold my-2">Kernel Size:</label>
                <input type="number" id="convolution-kernel" class="block w-full p-2 bg-gray-700 rounded mb-2" min="1" max="10" value="3">
            </div>
            <div class="setting">
                <label class="text-xl font-semibold my-2">Filter:</label>
                <div id="convolution-filter" class="filter-grid">
                    <input type="number" value="1">
                    <input type="number" value="1">
                    <input type="number" value="1">
                    <input type="number" value="1">
                    <input type="number" value="1">
                    <input type="number" value="1">
                    <input type="number" value="1">
                    <input type="number" value="1">
                    <input type="number" value="1">
                </div>
            </div>
            <div class="setting">
                <label for="random-min" class="text-xl font-semibold my-2">Random Min:</label>
                <input type="number" id="random-min" class="block w-full p-2 bg-gray-700 rounded mb-2" min="0" max="1" step="0.1" value="0">
            </div>
            <div class="setting">
                <label for="random-max" class="text-xl font-semibold my-2">Random Max:</label>
                <input type="number" id="random-max" class="block w-full p-2 bg-gray-700 rounded mb-2" min="0" max="1" step="0.1" value="1">
            </div>
        </div>

        <h3 class="text-xl font-semibold my-2">Cell Size:</h3>
        <select id="grit-select" class="block w-full p-2 bg-gray-700 rounded mb-2">
            <option value="4">SS</option>
            <option value="8">S</option>
            <option value="12" selected>M</option>
            <option value="16">L</option>
        </select>
    </div>
    <script src="script.js"></script>
</body>
</html>
